name: Serpiente rosa
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#c41d7f&color_dots=#ebedf0,#ffd6e7,#ffadd2,#f759ab,#c41d7f
            dist/snake-dark.svg?palette=github-dark&color_snake=#f759ab&color_dots=#161b22,#5c1a3a,#9e1068,#eb2f96,#ffadd2
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
